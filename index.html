<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <style>
        :root {
            /* Paleta de colores basada en la imagen proporcionada */
            --bg-orange: #e85d04;
            --bg-magenta: #c70039;
            --bg-purple: #4a1942;
            
            --shape-yellow-1: #ffba08;
            --shape-yellow-2: #faa307;
            --shape-red-1: #dc2f02;
            --shape-red-2: #9d0208;
            
            --text-light: #ffffff;
            --text-gray: #f8f9fa;
            --font-family: 'Google Sans', 'Roboto', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            /* Degradado de fondo principal */
            background: linear-gradient(135deg, var(--bg-orange) 0%, var(--bg-magenta) 50%, var(--bg-purple) 100%);
            color: var(--text-light);
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column; /* Alineación en columna para poner el logo abajo */
            justify-content: center;
            align-items: center;
            gap: 35px; /* Espacio entre el rectángulo y el logo circular */
            position: relative;
        }

        /* Canvas de fondo para animación de figuras 3D */
        #neural-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Contenedor principal centrado (Rectángulo) */
        .content-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 50px 60px;
            max-width: 800px;
            animation: fadeInUp 1.5s ease-out;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.05); /* Cristal */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Texto y Títulos */
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, #ffe5d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 500;
            color: #ffba08;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-gray);
            font-style: italic;
            opacity: 0.9;
        }

        /* 🔴 Contenedor Circular para el Logo Intelcia 🔴 */
        .intelcia-circle {
            position: relative;
            z-index: 10;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #ffffff; /* Borde blanco grueso */
            background: linear-gradient(135deg, var(--bg-orange) 0%, var(--bg-magenta) 50%, var(--bg-purple) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1.8s ease-out; /* Animación ligeramente retrasada */
            overflow: hidden; /* Asegura que la imagen no se salga del círculo */
        }

        .intelcia-circle img {
            width: 75%; /* Ajusta este valor si quieres que el logo se vea más grande o pequeño dentro del círculo */
            height: auto;
            object-fit: contain;
        }

        /* Responsividad */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1rem; }
            .content-container { padding: 30px 20px; }
            .intelcia-circle { width: 90px; height: 90px; border-width: 3px; }
        }
    </style>
</head>
<body>

    <!-- Canvas para la animación de fondo estilo 3D -->
    <canvas id="neural-canvas"></canvas>

    <!-- RECTÁNGULO DE CRISTAL -->
    <div class="content-container">
        <h2>Trusted Intelligent Operations</h2>
        <h1>Evoluciona</h1>
        <p class="subtitle">Innovación & Transformación Digital</p>
    </div>

    <script>
        /**
         * Animación de Cuadrados 3D Flotantes
         * Simula formas geométricas con diseño superpuesto y movimiento continuo.
         */
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let shapes = [];

        // Ajustar tamaño del canvas
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Clase para las formas tridimensionales
        class FloatingShape {
            constructor() {
                this.reset();
                this.x = Math.random() * width; // Distribución inicial aleatoria
            }

            reset() {
                this.size = Math.random() * 150 + 100; // Tamaño entre 100 y 250
                this.x = Math.random() > 0.5 ? -this.size : width + this.size;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5; // Velocidad X
                this.vy = (Math.random() - 0.5) * 1.5; // Velocidad Y
                this.rotation = Math.random() * Math.PI * 2;
                this.vRotation = (Math.random() - 0.5) * 0.01; // Velocidad de rotación lenta
                
                // Efecto de offset tridimensional
                this.offsetX = (Math.random() * 30 + 10) * (Math.random() > 0.5 ? 1 : -1);
                this.offsetY = (Math.random() * 30 + 10) * (Math.random() > 0.5 ? 1 : -1);
                
                this.alpha = Math.random() * 0.5 + 0.3; // Transparencia
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.vRotation;

                // Reaparecer si salen de la pantalla
                if (this.x < -this.size * 2 || this.x > width + this.size * 2 || 
                    this.y < -this.size * 2 || this.y > height + this.size * 2) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.alpha;

                // Polyfill simple para borde redondeado si roundRect no existe
                if(!ctx.roundRect) {
                    ctx.roundRect = function(x, y, w, h, r) {
                        this.rect(x, y, w, h);
                    }
                }

                // Figura de fondo (Efecto sombra/Offset con línea)
                ctx.beginPath();
                ctx.roundRect(-this.size/2 + this.offsetX, -this.size/2 + this.offsetY, this.size, this.size, 40);
                let outlineGrad = ctx.createLinearGradient(-this.size/2, -this.size/2, this.size/2, this.size/2);
                outlineGrad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
                outlineGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
                ctx.strokeStyle = outlineGrad;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Figura principal (Bloque de color frontal naranja/amarillo)
                ctx.beginPath();
                ctx.roundRect(-this.size/2, -this.size/2, this.size, this.size, 40);
                
                let fillGrad = ctx.createLinearGradient(-this.size/2, -this.size/2, this.size/2, this.size/2);
                fillGrad.addColorStop(0, '#ffba08'); 
                fillGrad.addColorStop(1, '#dc2f02'); 
                
                ctx.fillStyle = fillGrad;
                ctx.fill();

                ctx.restore();
            }
        }

        // Inicializar figuras
        function initShapes() {
            shapes = [];
            const count = window.innerWidth < 768 ? 6 : 12; // Menos figuras en móvil
            for (let i = 0; i < count; i++) {
                shapes.push(new FloatingShape());
            }
        }

        // Bucle de animación
        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < shapes.length; i++) {
                shapes[i].update();
                shapes[i].draw();
            }

            requestAnimationFrame(animate);
        }

        initShapes();
        animate();
